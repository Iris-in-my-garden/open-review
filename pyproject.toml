[project]
name = "openreview"
version = "0.1.0"
description = "AI-powered GitHub PR code review with AST-aware context retrieval and structured findings"
readme = "README.md"
authors = [
    { name = "Ran", email = "55568777+Iris-in-my-garden@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "filelock>=4.2.4",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.19",
    "iniconfig==2.3.0",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "openai>=3.11.0",
    "packaging==26.3",
    "pip==26.0.1",
    "pluggy==1.6.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pygments==2.21.0",
    "pytest==9.1.1",
    "requests==2.34.2",
    "rich==15.0.0",
    "setuptools==82.0.0",
    "shellingham==1.5.4",
    "tree-sitter>=0.26.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "typer==0.27.2",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "urllib3==2.7.0",
]

[project.scripts]
openreview = "openreview.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".cache", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["^tests/"]
