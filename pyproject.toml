[project]
name = "openreview"
version = "0.1.0"
description = "AI-powered GitHub PR code review with hybrid context retrieval and structured findings"
readme = "README.md"
authors = [
    { name = "Ran", email = "55568777+Iris-in-my-garden@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "filelock>=4.2.4",
    "httpx>=0.28.1",
    "openai>=3.11.0",
    "pydantic>=2.13.5",
    "tree-sitter>=0.26.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.2",
]

[project.scripts]
openreview = "openreview.cli:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", ".cache", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["^tests/"]
